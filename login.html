<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar ou criar conta — Dossel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #043d30;
        --moss: #1d9e75;
        --paper: #f4efe6;
        --ink: #0a1f1a;
        --ink-mute: #6b7d76;
        --hair: rgba(4, 61, 48, 0.14);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        padding: 24px;
      }
      .box {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid var(--hair);
        border-radius: 14px;
        box-shadow: 0 10px 28px -16px rgba(4, 61, 48, 0.25);
        padding: 36px 32px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: "DM Serif Display", serif;
        font-size: 24px;
        color: var(--forest);
        margin-bottom: 26px;
      }
      h1 {
        font-family: "DM Serif Display", serif;
        font-weight: 400;
        font-size: 22px;
        margin-bottom: 6px;
      }
      p.sub {
        color: var(--ink-mute);
        font-size: 13.5px;
        margin-bottom: 22px;
      }
      label {
        display: block;
        font-size: 12.5px;
        color: var(--ink-mute);
        margin-bottom: 6px;
      }
      .field { margin-bottom: 16px; }
      input {
        width: 100%;
        font: inherit;
        color: var(--ink);
        padding: 11px 13px;
        border: 1px solid var(--hair);
        border-radius: 8px;
        background: var(--paper);
      }
      input:focus {
        outline: 2px solid var(--moss);
        outline-offset: 1px;
      }
      button.submit {
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        border-radius: 8px;
        background: var(--forest);
        color: #fff;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background 0.15s ease;
      }
      button.submit:hover { background: #032821; }
      button.submit:disabled { opacity: 0.6; cursor: default; }
      .error {
        margin-top: 14px;
        font-size: 13px;
        color: #a23b3b;
        background: rgba(196, 68, 68, 0.1);
        border-radius: 8px;
        padding: 10px 12px;
        display: none;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: var(--ink-mute);
        text-decoration: none;
      }
      .back:hover { color: var(--forest); }
      .tabs {
        display: flex;
        background: var(--paper);
        border-radius: 999px;
        padding: 4px;
        margin-bottom: 24px;
      }
      .tabs button {
        flex: 1;
        border: none;
        background: none;
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-mute);
        padding: 9px 0;
        border-radius: 999px;
        cursor: pointer;
      }
      .tabs button.active {
        background: var(--forest);
        color: #fff;
      }
      .field.signup-only { display: none; }
      .msg {
        margin-top: 14px;
        font-size: 13px;
        color: #157054;
        background: rgba(29, 158, 117, 0.1);
        border-radius: 8px;
        padding: 10px 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 3C10 3 6 8 6 13.5c0 3.5 2 6 4 7-1.5.5-3 2-3 4.5 0 3 2.5 4 4.5 4h9c2 0 4.5-1 4.5-4 0-2.5-1.5-4-3-4.5 2-1 4-3.5 4-7C26 8 22 3 16 3Z" fill="#F4EFE6"/>
          <path d="M16 12v17" stroke="#043D30" stroke-width="1.4"/>
        </svg>
        Dossel
      </div>

      <div class="tabs">
        <button type="button" id="tab-entrar" class="active">Entrar</button>
        <button type="button" id="tab-criar">Criar conta</button>
      </div>

      <h1 id="form-title">Entrar</h1>
      <p class="sub" id="form-sub">Acesse o portal do produtor ou o painel interno da equipe.</p>
      <form id="login-form">
        <div class="field signup-only">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="senha" id="senha-label">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password" minlength="6" />
        </div>
        <button type="submit" class="submit" id="submit-btn">Entrar</button>
        <div class="error" id="error-box"></div>
        <div class="msg" id="msg-box"></div>
      </form>
      <a href="index.html" class="back">← Voltar para o site</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="portal-auth.js"></script>
    <script>
      const form = document.getElementById("login-form");
      const errorBox = document.getElementById("error-box");
      const msgBox = document.getElementById("msg-box");
      const submitBtn = document.getElementById("submit-btn");
      const tabEntrar = document.getElementById("tab-entrar");
      const tabCriar = document.getElementById("tab-criar");
      const nomeField = document.querySelector(".field.signup-only");
      const nomeInput = document.getElementById("nome");

      let modo = "entrar"; // "entrar" | "criar"

      function setModo(novoModo) {
        modo = novoModo;
        errorBox.style.display = "none";
        msgBox.style.display = "none";

        const criando = modo === "criar";
        tabEntrar.classList.toggle("active", !criando);
        tabCriar.classList.toggle("active", criando);
        nomeField.style.display = criando ? "block" : "none";
        nomeInput.required = criando;
        document.getElementById("form-title").textContent = criando ? "Criar conta" : "Entrar";
        document.getElementById("form-sub").textContent = criando
          ? "Crie sua conta para acompanhar o projeto da sua propriedade."
          : "Acesse o portal do produtor ou o painel interno da equipe.";
        document.getElementById("senha-label").textContent = criando ? "Crie uma senha" : "Senha";
        document.getElementById("senha").autocomplete = criando ? "new-password" : "current-password";
        submitBtn.textContent = criando ? "Criar conta" : "Entrar";
      }

      tabEntrar.addEventListener("click", () => setModo("entrar"));
      tabCriar.addEventListener("click", () => setModo("criar"));

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";
        msgBox.style.display = "none";
        submitBtn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;

        if (modo === "criar") {
          submitBtn.textContent = "Criando conta…";
          const nome = nomeInput.value.trim();

          const { data, error } = await dosselSupabase.auth.signUp({
            email,
            password: senha,
            options: { data: { nome_completo: nome } },
          });

          if (error) {
            errorBox.textContent =
              error.message.includes("already registered") || error.message.includes("already exists")
                ? "Esse e-mail já tem conta. Tente entrar."
                : "Não foi possível criar a conta. Confira os dados e tente de novo.";
            errorBox.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = "Criar conta";
            return;
          }

          if (!data.session) {
            msgBox.textContent = "Conta criada! Confira seu e-mail para confirmar o cadastro antes de entrar.";
            msgBox.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = "Criar conta";
            return;
          }

          window.location.href = "portal-produtor.html";
          return;
        }

        submitBtn.textContent = "Entrando…";
        const { error } = await dosselSupabase.auth.signInWithPassword({
          email,
          password: senha,
        });

        if (error) {
          errorBox.textContent = "E-mail ou senha inválidos.";
          errorBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Entrar";
          return;
        }

        const { data: souEquipe } = await dosselSupabase
          .from("equipe")
          .select("id")
          .maybeSingle();

        window.location.href = souEquipe ? "painel-interno.html" : "portal-produtor.html";
      });
    </script>
  </body>
</html>
